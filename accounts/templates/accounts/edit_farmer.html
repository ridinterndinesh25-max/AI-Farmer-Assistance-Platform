{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Farmer | AI Farmer{% endblock %}

{% block extra_css %}

<link rel="stylesheet" href="{% static 'css/profile.css' %}">

{% endblock %}


{% block content %}

<div class="profile-page">

    <!-- =====================================================
         PROFILE HEADER
    ====================================================== -->

    <div class="profile-header">

        <div class="profile-avatar">
            👨‍🌾
        </div>

        <div class="profile-header-text">

            <h1>Edit Farmer</h1>

            <p>
                Update farmer profile details
            </p>

        </div>

    </div>


    <!-- =====================================================
         PROFILE CARD
    ====================================================== -->

    <div class="profile-card">

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- =================================================
                 USERNAME
            ================================================== -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ farmer.username }}"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- =================================================
                 EMAIL
            ================================================== -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ farmer.email }}"
                    placeholder="Enter email"
                >

            </div>


            <!-- =================================================
                 PHONE
            ================================================== -->

            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    value="{{ farmer_profile.phone }}"
                    placeholder="Enter phone number"
                >

            </div>


            <!-- =================================================
                 VILLAGE
            ================================================== -->

            <div class="form-group">

                <label for="village">
                    Village
                </label>

                <input
                    type="text"
                    id="village"
                    name="village"
                    value="{{ farmer_profile.village }}"
                    placeholder="Enter village"
                >

            </div>


            <!-- =================================================
                 DISTRICT
            ================================================== -->

            <div class="form-group">

                <label for="district">
                    District
                </label>

                <input
                    type="text"
                    id="district"
                    name="district"
                    value="{{ farmer_profile.district }}"
                    placeholder="Enter district"
                >

            </div>


            <!-- =================================================
                 STATE
            ================================================== -->

            <div class="form-group">

                <label for="state">
                    State
                </label>

                <input
                    type="text"
                    id="state"
                    name="state"
                    value="{{ farmer_profile.state }}"
                    placeholder="Enter state"
                >

            </div>


            <!-- =================================================
                 LAND SIZE
            ================================================== -->

            <div class="form-group">

                <label for="land_size">
                    Land Size (Acre)
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="land_size"
                    name="land_size"
                    value="{{ farmer_profile.land_size|default:'' }}"
                    placeholder="Enter land size"
                >

            </div>


            <!-- =================================================
                 PROFILE PHOTO
            ================================================== -->

            <div class="form-group">

                <label for="photo">
                    Profile Photo
                </label>

                <input
                    type="file"
                    id="photo"
                    name="photo"
                    accept="image/*"
                >

            </div>


            <!-- =================================================
                 CURRENT PHOTO
            ================================================== -->

            {% if farmer_profile.photo %}

            <div
                style="
                    margin-top: 15px;
                    margin-bottom: 20px;
                "
            >

                <label
                    style="
                        display: block;
                        margin-bottom: 10px;
                        font-weight: 600;
                    "
                >
                    Current Photo
                </label>

                <img
                    src="{{ farmer_profile.photo.url }}"
                    alt="Current Farmer Photo"
                    style="
                        width: 120px;
                        height: 120px;
                        object-fit: cover;
                        border-radius: 50%;
                        border: 4px solid #166534;
                        padding: 3px;
                        background: white;
                    "
                >

            </div>

            {% endif %}


            <!-- =================================================
                 BUTTONS
            ================================================== -->

            <div style="margin-top: 25px;">

                <button
                    type="submit"
                    style="
                        padding: 11px 24px;
                        background: #166534;
                        color: white;
                        border: none;
                        border-radius: 8px;
                        font-weight: 600;
                        cursor: pointer;
                    "
                >
                    💾 Save Changes
                </button>


                <a
                    href="{% url 'profile_history' %}"
                    style="
                        margin-left: 10px;
                        padding: 11px 24px;
                        background: #64748b;
                        color: white;
                        text-decoration: none;
                        border-radius: 8px;
                        font-weight: 600;
                    "
                >
                    ← Back
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
