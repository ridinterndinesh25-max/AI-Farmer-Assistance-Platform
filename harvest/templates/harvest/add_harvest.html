{% extends "base.html" %}
{% load static %}

{% block title %}
Add Harvest Record | AI Farmer
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/add_harvest.css' %}">
{% endblock %}

{% block content %}

<div class="add-harvest-page">

    <!-- ================= HEADER ================= -->

    <div class="add-harvest-header">

        <div class="add-harvest-heading">

            <div class="add-harvest-icon">
                🌾
            </div>

            <div>
                <h2>Add Harvest Record</h2>

                <p>
                    Add and save your crop harvesting details.
                </p>
            </div>

        </div>

    </div>


    <!-- ================= FORM CARD ================= -->

    <div class="add-harvest-card">

        <form
            method="POST"
            action="{% url 'harvest:add_harvest' %}">

            {% csrf_token %}

            <div class="row">

                <!-- Crop Name -->

                <div class="col-md-6 mb-3">

                    <label
                        for="crop_name"
                        class="form-label">

                        🌱 Crop Name

                    </label>

                    <input
                        type="text"
                        id="crop_name"
                        name="crop_name"
                        class="form-control"
                        placeholder="Example: Wheat"
                        required>

                </div>


                <!-- Expected Date -->

                <div class="col-md-6 mb-3">

                    <label
                        for="expected_harvest_date"
                        class="form-label">

                        📅 Expected Harvest Date

                    </label>

                    <input
                        type="date"
                        id="expected_harvest_date"
                        name="expected_harvest_date"
                        class="form-control"
                        required>

                </div>


                <!-- Actual Date -->

                <div class="col-md-6 mb-3">

                    <label
                        for="actual_harvest_date"
                        class="form-label">

                        📅 Actual Harvest Date

                    </label>

                    <input
                        type="date"
                        id="actual_harvest_date"
                        name="actual_harvest_date"
                        class="form-control">

                </div>


                <!-- Quantity -->

                <div class="col-md-6 mb-3">

                    <label
                        for="quantity"
                        class="form-label">

                        ⚖️ Quantity

                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        class="form-control"
                        step="0.01"
                        min="0"
                        placeholder="Example: 500">

                </div>


                <!-- Unit -->

                <div class="col-md-6 mb-3">

                    <label
                        for="quantity_unit"
                        class="form-label">

                        📦 Unit

                    </label>

                    <select
                        id="quantity_unit"
                        name="quantity_unit"
                        class="form-select">

                        <option value="kg">
                            Kilogram (kg)
                        </option>

                        <option value="quintal">
                            Quintal
                        </option>

                        <option value="ton">
                            Ton
                        </option>

                    </select>

                </div>


                <!-- Status -->

                <div class="col-md-6 mb-3">

                    <label
                        for="status"
                        class="form-label">

                        📌 Status

                    </label>

                    <select
                        id="status"
                        name="status"
                        class="form-select">

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Ready">
                            Ready for Harvest
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>


                <!-- Notes -->

                <div class="col-12 mb-3">

                    <label
                        for="notes"
                        class="form-label">

                        📝 Notes

                    </label>

                    <textarea
                        id="notes"
                        name="notes"
                        class="form-control"
                        rows="4"
                        placeholder="Enter additional information..."></textarea>

                </div>

            </div>


            <!-- ================= ACTIONS ================= -->

            <div class="add-harvest-actions">

                <a
                    href="{% url 'harvest:harvest_list' %}"
                    class="add-harvest-cancel">

                    ❌ Cancel

                </a>


                <button
                    type="submit"
                    class="add-harvest-save">

                    🌾 Save Harvest Record

                </button>

            </div>

        </form>

    </div>

</div>

<script src="{% static 'js/harvest.js' %}"></script>

{% endblock %}
