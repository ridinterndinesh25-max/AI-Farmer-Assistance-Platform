
{% extends "base.html" %}
{% load static %}

{% block title %}
Edit Harvest | AI Farmer
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/edit_harvest.css' %}">
{% endblock %}

{% block content %}

<div class="edit-harvest-page">

    <!-- ================= HEADER ================= -->

    <div class="edit-harvest-header">

        <div class="edit-harvest-heading">

            <div class="edit-harvest-icon">
                ✏️
            </div>

            <div>
                <h2>Edit Harvest Record</h2>

                <p>
                    Update your crop harvesting details.
                </p>
            </div>

        </div>

        <a
            href="{% url 'harvest:harvest_list' %}"
            class="edit-harvest-back-btn">

            ← Back to Harvest

        </a>

    </div>


    <!-- ================= FORM CARD ================= -->

    <div class="edit-harvest-card">

        <form
            method="POST"
            action="{% url 'harvest:edit_harvest' harvest.id %}">

            {% csrf_token %}

            <div class="row">

                <!-- Crop Name -->

                <div class="col-md-6 mb-4">

                    <label
                        for="crop_name"
                        class="form-label">

                        🌱 Crop Name

                    </label>

                    <input
                        type="text"
                        id="crop_name"
                        name="crop_name"
                        class="form-control"
                        value="{{ harvest.crop_name }}"
                        placeholder="Example: Wheat"
                        required>

                </div>


                <!-- Expected Date -->

                <div class="col-md-6 mb-4">

                    <label
                        for="expected_harvest_date"
                        class="form-label">

                        📅 Expected Harvest Date

                    </label>

                    <input
                        type="date"
                        id="expected_harvest_date"
                        name="expected_harvest_date"
                        class="form-control"
                        value="{{ harvest.expected_harvest_date|date:'Y-m-d' }}"
                        required>

                </div>


                <!-- Actual Date -->

                <div class="col-md-6 mb-4">

                    <label
                        for="actual_harvest_date"
                        class="form-label">

                        📅 Actual Harvest Date

                    </label>

                    <input
                        type="date"
                        id="actual_harvest_date"
                        name="actual_harvest_date"
                        class="form-control"
                        value="{% if harvest.actual_harvest_date %}{{ harvest.actual_harvest_date|date:'Y-m-d' }}{% endif %}">

                </div>


                <!-- Quantity -->

                <div class="col-md-6 mb-4">

                    <label
                        for="quantity"
                        class="form-label">

                        ⚖️ Quantity

                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        class="form-control"
                        value="{{ harvest.quantity|default:'' }}"
                        step="0.01"
                        min="0"
                        placeholder="Example: 500">

                </div>


                <!-- Unit -->

                <div class="col-md-6 mb-4">

                    <label
                        for="quantity_unit"
                        class="form-label">

                        📦 Unit

                    </label>

                    <select
                        id="quantity_unit"
                        name="quantity_unit"
                        class="form-select">

                        <option
                            value="kg"
                            {% if harvest.quantity_unit == "kg" %}
                            selected
                            {% endif %}>
                            Kilogram (kg)
                        </option>

                        <option
                            value="quintal"
                            {% if harvest.quantity_unit == "quintal" %}
                            selected
                            {% endif %}>
                            Quintal
                        </option>

                        <option
                            value="ton"
                            {% if harvest.quantity_unit == "ton" %}
                            selected
                            {% endif %}>
                            Ton
                        </option>

                    </select>

                </div>


                <!-- Status -->

                <div class="col-md-6 mb-4">

                    <label
                        for="status"
                        class="form-label">

                        📌 Status

                    </label>

                    <select
                        id="status"
                        name="status"
                        class="form-select">

                        <option
                            value="Pending"
                            {% if harvest.status == "Pending" %}
                            selected
                            {% endif %}>
                            Pending
                        </option>

                        <option
                            value="Ready"
                            {% if harvest.status == "Ready" %}
                            selected
                            {% endif %}>
                            Ready for Harvest
                        </option>

                        <option
                            value="Completed"
                            {% if harvest.status == "Completed" %}
                            selected
                            {% endif %}>
                            Completed
                        </option>

                    </select>

                </div>


                <!-- Notes -->

                <div class="col-12 mb-4">

                    <label
                        for="notes"
                        class="form-label">

                        📝 Notes

                    </label>

                    <textarea
                        id="notes"
                        name="notes"
                        class="form-control"
                        rows="5"
                        placeholder="Enter additional information...">{{ harvest.notes|default:'' }}</textarea>

                </div>

            </div>


            <!-- ================= BUTTONS ================= -->

            <div class="edit-harvest-actions">

                <a
                    href="{% url 'harvest:harvest_list' %}"
                    class="edit-harvest-cancel">

                    ❌ Cancel

                </a>

                <button
                    type="submit"
                    class="edit-harvest-save">

                    💾 Update Harvest

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
